<!DOCTYPE html>
<html>
<head>
    <title>Sparx Learning</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            padding: 60px 20px;
        }

        .game-card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .play-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: #00a2ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .play-button:hover {
            background: #0088d4;
        }
    </style>
</head>

<body>

<header>
    <h1>SPARX LEARNING</h1>
    <p>Learn • Play • Explore</p>
</header>

<div class="container">

    <div class="game-card">
        <h2>🎮 Roblox</h2>
        <p>Click below to visit Roblox.</p>

        <a class="play-button"
           href="https://www.roblox.com/"
           target="_blank"
           rel="noopener noreferrer">
            PLAY ROBLOX
        </a>
    </div>

</div>

</body>
</html>
